version: v2beta1
name: troubleshooting-panel-console-plugin

vars:
  DEVSPACE_IMAGE:
    command: bash -c "cat .devspace/devimage 2>/dev/null || echo quay.io/openshift-observability-ui/troubleshooting-panel-console-plugin:devspace"

pipelines:
  dev:
    run: start_dev app
  purge:
    run: stop_dev --all

dev:
  app:
    labelSelector:
      app.kubernetes.io/instance: troubleshooting-panel
    devImage: ${DEVSPACE_IMAGE}

    sync:
      - path: ./web:/opt/app-root/web
        excludePaths:
          - node_modules/
          - dist/
          - package.json
          - package-lock.json
        startContainer: true
        printLogs: true
        waitInitialSync: true

    logs:
      enabled: true

    command: ["sh", "-c"]
    args:
      - |
        cd /opt/app-root
        make watch-frontend &
        echo "Waiting for initial frontend build..."
        while [ ! -f web/dist/plugin-manifest.json ]; do sleep 1; done
        echo "Frontend build complete, starting backend..."
        make start-devspace-backend FEATURES=agent-navigation
    ssh:
      enabled: true
